name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dygo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DYGO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dygo_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio/ui/package-lock.json

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          test "$(git cat-file -t "$tag")" = "tag"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Build Studio UI
        working-directory: apps/studio/ui
        run: |
          npm ci
          npm test
          find ../../../internal/studio/bundled -type f ! -name placeholder.txt -delete
          npm run build:embed

      - name: Verify framework App bundles
        run: |
          go generate ./internal/frameworkapp
          go generate ./internal/studio
          git diff --exit-code -- internal/frameworkapp/bundled/core
          git diff --exit-code -- internal/studio/bundled-app

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Test installer
        run: |
          bash -n scripts/*.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          scripts/test-install.sh

      - name: Build release assets
        run: |
          scripts/build-release.sh "${GITHUB_REF_NAME}" dist
          scripts/smoke-release.sh "${GITHUB_REF_NAME}" dist

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "dygo ${GITHUB_REF_NAME}" \
            "${args[@]}"
