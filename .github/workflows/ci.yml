name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dygo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DYGO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dygo_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio/ui/package-lock.json

      - name: Verify framework App bundles
        run: |
          go generate ./internal/frameworkapp
          go generate ./internal/studio
          git diff --exit-code -- internal/frameworkapp/bundled/core
          git diff --exit-code -- internal/studio/bundled-app

      - name: Test and build Studio
        working-directory: apps/studio/ui
        run: |
          npm ci
          npm test
          npm run build:embed

      - name: Test Go
        run: go test ./...

      - name: Vet Go
        run: go vet ./...

      - name: Test release scripts and installer
        run: |
          bash -n scripts/*.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          scripts/test-install.sh

      - name: Build and smoke release assets
        run: |
          scripts/build-release.sh v0.0.0-ci dist
          scripts/smoke-release.sh v0.0.0-ci dist

  verify-windows-installer:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: true

      - name: Test PowerShell installer lifecycle
        shell: ${{ matrix.shell }}
        run: scripts/test-install.ps1

  verify-macos-installer:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache: true

      - name: Test shell installer lifecycle
        run: scripts/test-install.sh

      - name: Upgrade an actual released binary to the candidate
        shell: bash
        run: |
          set -euo pipefail
          version=v0.0.0-ci
          case "$(uname -m)" in arm64) arch=arm64 ;; *) arch=amd64 ;; esac
          release_dir="$RUNNER_TEMP/dygo-release"
          mkdir -p "$release_dir"
          go build -trimpath -ldflags "-s -w -X github.com/hapyco/dygo/internal/cli.version=$version" -o "$release_dir/dygo" ./cmd/dygo
          asset="dygo_${version}_darwin_${arch}.tar.gz"
          tar -C "$release_dir" -czf "$release_dir/$asset" dygo
          (cd "$release_dir" && shasum -a 256 "$asset" >checksums.txt)
          export DYGO_INSTALL_DIR="$RUNNER_TEMP/dygo-install"
          DYGO_VERSION=v0.0.6 scripts/install.sh
          test "$("$DYGO_INSTALL_DIR/dygo" version)" = "dygo v0.0.6"
          DYGO_VERSION="$version" DYGO_DOWNLOAD_BASE_URL="file://$release_dir" scripts/install.sh
          test "$("$DYGO_INSTALL_DIR/dygo" version)" = "dygo $version"
